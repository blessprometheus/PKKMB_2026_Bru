# Konfigurasi Nginx untuk PKKMB UNINUS 2026.
# Lihat docs/06-deployment.md §3 untuk penjelasan arsitektur same-origin.
#
# CARA PAKAI:
#   1. Salin ke /etc/nginx/sites-available/pkkmb26.conf
#   2. Ganti SEMUA placeholder GANTI_* di bawah dengan nilai server sungguhan.
#   3. ln -s /etc/nginx/sites-available/pkkmb26.conf /etc/nginx/sites-enabled/
#   4. nginx -t   (wajib lolos sebelum reload)
#   5. systemctl reload nginx
#   6. certbot --nginx -d GANTI_DOMAIN   (mengisi blok SSL otomatis)
#
# TODO: [D12] domain produksi belum final. Placeholder di bawah:
# pkkmb.uninus.ac.id (rancangan, lihat docs/06-deployment.md §1).

upstream pkkmb26_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name GANTI_DOMAIN;

    # certbot menaruh challenge ACME di sini saat pertama kali minta sertifikat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name GANTI_DOMAIN;

    # certbot mengisi baris ssl_certificate di bawah ini secara otomatis.
    # ssl_certificate     /etc/letsencrypt/live/GANTI_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/GANTI_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Header keamanan (docs/04-security.md §7) ──────────────────────────
    # PENTING: Referrer-Policy TIDAK BOLEH no-referrer — Sanctum bergantung
    # pada header Referer untuk GET same-origin. Ditemukan lewat uji Fase 4.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # SENGAJA Report-Only, BUKAN ditegakkan. Diverifikasi 24 Sep 2026 dari hasil
    # `next build`: HTML Next.js App Router memuat <script> inline
    # (`self.__next_f.push(...)`) untuk hidrasi. `script-src 'self'` yang
    # ditegakkan akan memblokirnya — form cari NIM, /admin, dan /scan mati total.
    # Jalan keluar yang benar adalah nonce lewat proxy.ts (docs/04-security.md §7),
    # dan itu belum dikerjakan. Sampai saat itu: pelanggaran hanya dilaporkan di
    # console browser, tidak diblokir. JANGAN "memperbaiki" dengan 'unsafe-inline'.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'" always;

    # Impor Excel maksimal 10 MB (config/pkkmb.php import.max_file_size_kb).
    client_max_body_size 12m;

    access_log /var/log/nginx/pkkmb26.access.log;
    error_log  /var/log/nginx/pkkmb26.error.log;

    # ── API Laravel & Sanctum ──────────────────────────────────────────────
    #
    # SENGAJA DUA BLOK PREFIX TERPISAH (bukan satu location regex gabungan
    # `~ ^/(api|sanctum)/` dengan php nested di dalamnya). Nginx menyarankan
    # location bersarang berupa PREFIX di luar + REGEX di dalam
    # (`location ^~ /prefix/ { location ~ \.php$ {...} } }`) — itu pola yang
    # umum dipakai & terdokumentasi. Regex-di-dalam-regex tidak punya
    # jaminan urutan match yang sama jelasnya, dan berkas ini tidak bisa
    # diuji `nginx -t` di mesin pengembangan (Windows, tanpa akses VPS) —
    # jadi dipilih pola yang paling sedikit kemungkinan salah tafsirnya.
    location ^~ /api/ {
        root /var/www/pkkmb26/backend/public;
        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            # TODO: sesuaikan versi PHP-FPM socket setelah instalasi nyata.
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    location ^~ /sanctum/ {
        root /var/www/pkkmb26/backend/public;
        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # storage/ TIDAK PERNAH dilayani langsung — file Excel & aset privat ada
    # di sana (docs/04-security.md §5.1). Unduhan nametag/QR lewat controller
    # Laravel (rute bertanda tangan), bukan akses berkas statis.
    #
    # Cukup `return 404` saja — `deny all` di baris berikutnya tidak akan
    # pernah tercapai (deny sendiri sudah memotong permintaan lebih dulu
    # dengan 403), jadi menuliskan keduanya hanya kode mati yang membingungkan.
    location ^~ /storage/ {
        return 404;
    }

    # Aset statis Next.js — nama berkas sudah memuat hash, aman di-cache lama
    # DI BROWSER pengunjung lewat header Cache-Control ini.
    #
    # TIDAK memakai `proxy_cache` (cache sisi Nginx sendiri di server) — itu
    # butuh `proxy_cache_path` dengan ukuran disk yang ditentukan sesuai
    # kapasitas VPS sungguhan, yang belum diketahui (§2 tabel "Versi server"
    # masih TODO). Untuk skala acara ini (±550 pengunjung dalam satu pagi),
    # cache browser saja sudah cukup; jangan menebak angka kapasitas disk.
    location /_next/static/ {
        proxy_pass http://pkkmb26_nextjs;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Semua rute lain → Next.js ──────────────────────────────────────────
    #
    # TANPA header Upgrade/Connection: aplikasi ini tidak memakai WebSocket
    # (tidak ada fitur real-time). Menyetel `Connection: upgrade` secara tetap
    # pada SETIAP permintaan — bukan hanya saat klien memang meminta upgrade —
    # adalah kesalahan salin-tempel yang umum terjadi dan justru MERUSAK
    # penggunaan ulang koneksi (`keepalive`) ke upstream Next.js. Kalau nanti
    # dibutuhkan WebSocket, tambahkan `map $http_upgrade $connection_upgrade`
    # di konteks http{} lalu pakai variabel itu, jangan string tetap.
    location / {
        proxy_pass http://pkkmb26_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Vhost PKKMB UNINUS 2026 untuk server aaPanel produksi (103.74.5.229).
# Dipasang di: /www/server/panel/vhost/nginx/pkkmb.uninus.ac.id.conf
#
# Versi Ubuntu-polos dengan penjelasan tiap blok ada di pkkmb26.conf — berkas
# ini adalah turunannya yang disesuaikan dengan kondisi server NYATA, diperiksa
# 24 Sep 2026:
#   - Server dipakai bersama situs produksi UNINUS lain. Berkas ini HANYA
#     mendefinisikan server_name kita; tidak ada yang global.
#   - Domain diproksi Cloudflare. Sertifikat = Cloudflare Origin Certificate
#     *.uninus.ac.id yang sudah dipakai situs lain di server ini (s.d. 2041).
#   - PHP-FPM 8.4 lewat enable-php-84.conf (socket /tmp/php-cgi-84.sock).
#
# SETIAP perubahan: `nginx -t` WAJIB lolos sebelum reload — kesalahan di sini
# mematikan SEMUA situs UNINUS di server ini, bukan hanya PKKMB.
server
{
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pkkmb.uninus.ac.id;

    ssl_certificate /www/server/panel/vhost/cert/uninus.ac.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/uninus.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── IP asli pengunjung dari Cloudflare ──────────────────────────────────
    # Tanpa ini Laravel melihat IP Cloudflare, dan rate limit lookup (10/menit
    # per IP) menolak mahasiswa sungguhan yang kebetulan lewat edge yang sama.
    # Header hanya dipercaya bila datang DARI rentang Cloudflare — orang yang
    # menembak IP server langsung tidak bisa memalsukan IP-nya.
    # Sumber: https://www.cloudflare.com/ips-v4 dan /ips-v6 (diambil 24 Sep 2026).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/pkkmb26/backend/public;
    index index.php;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # JANGAN no-referrer — Sanctum butuh Referer (docs/04-security.md §7).
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Report-Only: script-src 'self' yang ditegakkan mematikan hidrasi Next.js.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'" always;
    # HSTS sengaja belum: dipasang setelah HTTPS lewat Cloudflare terbukti jalan.

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # API Laravel → index.php, ditangani location PHP dari enable-php-84.conf.
    location ^~ /api/     { try_files $uri /index.php?$query_string; }
    location ^~ /sanctum/ { try_files $uri /index.php?$query_string; }

    location ^~ /storage/ { return 404; }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include enable-php-84.conf;

    access_log  /www/wwwlogs/pkkmb.uninus.ac.id.log;
    error_log  /www/wwwlogs/pkkmb.uninus.ac.id.error.log;
}
